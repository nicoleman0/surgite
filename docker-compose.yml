services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surgite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surgite}
      POSTGRES_DB: ${POSTGRES_DB:-surgite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surgite}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Builds from source by default (`docker compose up --build`). A pre-built
    # registry image can be used instead by setting APP_IMAGE (see .env.example).
    build: .
    image: ${APP_IMAGE:-surgite-app:latest}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-surgite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surgite}
      POSTGRES_DB: ${POSTGRES_DB:-surgite}
      # Verify TLS on git clone/fetch by default. Self-hosters with a private
      # CA should trust it via GIT_SSL_CAINFO (see docs/self-host.md) rather
      # than disabling verification; GIT_SSL_NO_VERIFY=1 is the last resort.
      GIT_SSL_NO_VERIFY: ${GIT_SSL_NO_VERIFY:-0}
      REPO_CACHE_DIR: /var/surgite/repos
      # Fernet master for at-rest provider-key encryption. Set this in .env
      # for anything you care about. Left blank, the app generates one into
      # SECRETS_KEY_FILE below — which MUST live on a volume: /app is an
      # image layer, so a key written there dies with the container and takes
      # every stored provider key with it on the next redeploy.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_KEY_FILE: /var/surgite/data/.secrets_key
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      # Self-hosted model. LOCAL_BASE_URL must be reachable from inside this
      # container: localhost is the container, not the host.
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      LOCAL_MODEL: ${LOCAL_MODEL:-}
      LLM_LOCAL_ONLY: ${LLM_LOCAL_ONLY:-}
      # Private CA for the internal endpoint. The bundle must also be mounted
      # into the container (add it under volumes:) -- setting the path alone
      # does nothing. Blank is safe: httpx falls back to the public CA list.
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      SURGITE_USER: ${SURGITE_USER:-}
      SURGITE_ROLE: ${SURGITE_ROLE:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Repository sync workers. Set to 1 to process repositories serially.
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-4}
      # Upper bound for each clone, fetch, or log subprocess.
      GIT_TIMEOUT_SECONDS: ${GIT_TIMEOUT_SECONDS:-120}
    volumes:
      - surgite-repos:/var/surgite/repos
      - surgite-data:/var/surgite/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  surgite-repos:
  # Holds the generated Fernet master key when SECRETS_ENCRYPTION_KEY is
  # unset. Back it up, or `docker volume rm` it and every provider key
  # stored in the database becomes undecryptable.
  surgite-data:
